<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#071525,#162c42);color:#fff;padding:16px}
.card{max-width:560px;margin:auto;background:rgba(15,27,39,.97);border:1px solid #334b60;border-radius:22px;padding:18px;box-shadow:0 15px 40px #0008}
.hero{height:210px;border-radius:16px;overflow:hidden;background:#000;margin-bottom:15px;display:flex;justify-content:center}
.hero img{height:100%;max-width:100%;object-fit:contain}
.title{text-align:center;font-size:26px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ffd54f,#ff9f43,#ff5e8a,#9b7cff);-webkit-background-clip:text;color:transparent}
.sub{text-align:center;color:#aebdca;margin:6px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.full{grid-column:1/-1}
label{display:block;color:#d7e2ec;font-size:14px;margin:4px 0 5px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #40576b;background:#0e1c28;color:#fff;font-size:16px}
button{width:100%;padding:14px;margin-top:17px;border:0;border-radius:11px;font-size:17px;font-weight:bold;background:linear-gradient(90deg,#ffd54f,#ff9f43);color:#111}
.clear{margin-top:9px;background:#2b3b49;color:#fff}
.result{margin-top:18px;padding:16px;border-radius:14px;background:#1b2b38;border:1px solid #354b5c;line-height:1.9}
.total{color:#ffd54f;font-size:24px;font-weight:900;border-top:1px solid #496072;margin-top:8px;padding-top:9px}
.note{font-size:12px;color:#9eacb7;margin-top:13px;line-height:1.55}
@media(max-width:430px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero{height:190px}}
</style>

<div class="title">SAFDAR IMAM<br>FALCOR SALARY</div>
<div class="sub">Salary & Overtime Calculator</div>

<div class="grid">
<div><label>Basic Salary (AED)</label><input id="basic" type="number" value="1500"></div>
<div><label>Salary Days</label><input id="days" type="number" value="30"></div>
<div><label>Duty Hours / Day</label><input id="duty" type="number" value="8"></div>
<div><label>Normal OT Rate</label><input id="normalRate" type="number" value="1.25" step=".01"></div>
<div><label>Saturday Base (AED)</label><input id="satBase" type="number" value="1300"></div>
<div><label>Saturday OT Rate</label><input id="satRate" type="number" value="1.5" step=".01"></div>
<div><label>Normal OT Hours</label><input id="normalOT" type="number" value="0" step=".5"></div>
<div><label>Saturday OT Hours</label><input id="satOT" type="number" value="0" step=".5"></div>
<div class="full"><label>Absent Days</label><input id="absent" type="number" value="0" min="0"></div>
</div>

<button onclick="calculate()">CALCULATE SALARY</button>
<button class="clear" onclick="resetForm()">RESET</button>
<div class="result" id="result">OT और absent डालकर Calculate दबाएँ।</div>
<div class="note">Basic: 1500 AED / 30 दिन • Normal OT: 1.25× • Saturday OT: 1300 AED base पर 1.5× • Absent deduction: Basic ÷ 30 × absent days.</div>
</div>

<script>
function n(id){return Number(document.getElementById(id).value)||0}
function calculate(){
 const basic=n("basic"),days=n("days")||30,duty=n("duty")||8;
 const normalRate=n("normalRate")||1.25,satBase=n("satBase")||1300,satRate=n("satRate")||1.5;
 const normalOT=n("normalOT"),satOT=n("satOT"),absent=n("absent");
 const normalPay=normalOT*(basic/days/duty)*normalRate;
 const satPay=satOT*(satBase/days/duty)*satRate;
 const deduction=(basic/days)*absent;
 const total=basic+normalPay+satPay-deduction;
 document.getElementById("result").innerHTML=
 `<b>Basic Salary:</b> AED ${basic.toFixed(2)}<br>
 <b>Normal OT:</b> ${normalOT.toFixed(1)} h → AED ${normalPay.toFixed(2)}<br>
 <b>Saturday OT:</b> ${satOT.toFixed(1)} h → AED ${satPay.toFixed(2)}<br>
 <b>Absent:</b> ${absent} day → - AED ${deduction.toFixed(2)}
 <div class="total">TOTAL: AED ${total.toFixed(2)}</div>`;
}
function resetForm(){
 document.querySelectorAll("input").forEach((x)=>x.defaultValue!==undefined?x.value=x.defaultValue:null);
 document.getElementById("result").innerHTML="OT और absent डालकर Calculate दबाएँ।";
}
</script>
